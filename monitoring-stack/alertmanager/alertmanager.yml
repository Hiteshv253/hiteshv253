global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'discord-notifications'

receivers:
- name: 'discord-notifications'
  webhook_configs:
  # Route alert payloads to Discord integrations
  - url: 'https://discord.com/api/webhooks/12345678/example-webhook-hash'
    send_resolved: true
